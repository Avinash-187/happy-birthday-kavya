<!DOCTYPE html>
<html lang="en"><head><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@700&display=swap" rel="stylesheet"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday</title>
<style>
:root{--k:#111;--pk:#FF6B9D;--yl:#FFD93D;--bl:#6BCBFF;--gr:#7BE0A4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{overscroll-behavior:none;touch-action:manipulation}body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{height:100%;margin:0;background:#FFD9E8}
body{background:#FFD9E8;color:var(--k);font-family:'Trebuchet MS',Arial,sans-serif;text-align:center;overflow-x:hidden}
#cv{position:fixed;inset:0;pointer-events:none;z-index:6}
#stage{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 18px 28px;gap:16px;animation:pin .5s both}
@keyframes pin{from{opacity:0;transform:scale(.9) rotate(-2deg)}to{opacity:1;transform:none}}
h1,h2,p{margin:0}h2{font-size:1.7rem;font-weight:900;line-height:1.15}p{font-weight:600}
button{font:900 1.05rem 'Trebuchet MS',Arial,sans-serif;color:var(--k);background:var(--yl);border:3px solid var(--k);border-radius:12px;padding:10px 20px;box-shadow:4px 4px 0 var(--k);cursor:pointer}
button.sec{background:#fff}button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--k)}
.box{background:#fff;border:3px solid var(--k);border-radius:12px;box-shadow:5px 5px 0 var(--k);padding:14px}
.lv{position:absolute;top:14px;left:14px;background:var(--k);color:var(--yl);font-weight:900;font-size:.8rem;padding:4px 10px;border-radius:99px}
#mu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;z-index:7;padding:2px 12px;font-size:1.1rem}
.bar{height:22px;border:3px solid var(--k);border-radius:99px;background:#fff;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--gr);transition:width .3s}
.cake{position:relative;width:190px;height:170px;cursor:pointer}
.cake div{position:absolute;left:50%;transform:translateX(-50%);border-radius:10px;border:3px solid var(--k)}
.cake .p{bottom:0;width:196px;height:20px;background:var(--bl);border-radius:50%}
.cake .l1{bottom:10px;width:170px;height:56px;background:var(--pk)}
.cake .l2{bottom:60px;width:124px;height:46px;background:#fff}
.cake .c{bottom:104px;width:10px;height:30px;background:repeating-linear-gradient(#fff 0 6px,var(--pk) 6px 12px);border-radius:2px}
.flame{position:absolute;bottom:138px;left:50%;margin-left:-8px;width:16px;height:24px;background:radial-gradient(#fff,#ffcb5c 55%,#ff6a00);border-radius:50% 50% 50% 50%/62% 62% 38% 38%;animation:fl .25s infinite alternate;transition:opacity .3s}
@keyframes fl{to{transform:scale(1.15) rotate(6deg)}}.off .flame{opacity:0}
.pics{display:grid;grid-template-columns:1fr 1fr;justify-items:center;gap:26px 14px;max-width:350px;margin:0 auto}
.pola{width:150px;background:#fff;border:3px solid var(--k);padding:6px 6px 34px;position:relative;box-shadow:4px 4px 0 var(--k);cursor:pointer}
.pola img,.pola .ph{width:100%;height:140px;object-fit:cover;display:block}.pola .ph{background:var(--bl);display:grid;place-items:center;font-size:3rem}
.pola span{position:absolute;bottom:4px;left:2px;right:2px;font-size:.78rem;font-weight:900;line-height:1.1}
.lined{text-align:left;white-space:pre-wrap;max-width:340px;width:100%;min-height:230px;line-height:1.55;font-weight:600}
.hb{font-size:3.2rem;font-weight:900;line-height:.95;text-shadow:4px 4px 0 var(--yl)}
.bal{display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.3rem;position:absolute;width:58px;height:70px;border-radius:50% 50% 50% 50%/58% 58% 42% 42%;border:3px solid var(--k);cursor:pointer;animation:bob 2s infinite}
.bal:after{content:'';position:absolute;left:50%;top:100%;height:46px;border-left:3px solid var(--k)}
.bal:before{content:'';position:absolute;left:11px;top:10px;width:10px;height:16px;border-radius:50%;background:#fff9;transform:rotate(20deg)}
@keyframes bob{50%{transform:translateY(-10px)}}
.note{position:absolute;width:124px;padding:9px 8px;background:#fff;border:3px solid var(--k);box-shadow:4px 4px 0 var(--k);font-size:.82rem;font-weight:600;line-height:1.2;text-align:left;animation:np .4s both;z-index:2}
@keyframes np{from{opacity:0;transform:scale(.4)}}
.fl{position:fixed;left:0;top:0;z-index:0;pointer-events:none;white-space:nowrap;font-family:'Shantell Sans',cursive;font-weight:700;opacity:.6}@keyframes flo{from{transform:translateY(0)}to{transform:translateY(-125vh)}}</style></head><body>

function burst(n,bx,by){const cs=['#FF6B9D','#FFD93D','#6BCBFF','#7BE0A4','#fff','#111'];for(let i=0;i<n;i++)parts.push({x:bx??innerWidth/2,y:by??innerHeight*.45,vx:(Math.random()-.5)*14,vy:Math.random()*-13-2,c:cs[i%6],s:Math.random()*8+4,l:130,r:Math.random()*6})}
const nm=[...document.querySelectorAll('.fl')].map(el=>({el,x:0,y:0,w:0,h:0,init:false,vx:(Math.random()-.5)*.6,vy:-(Math.random()*.25+.15)}));function updNames(){if(!nm.length)return;const W=innerWidth,H=innerHeight;nm.forEach(o=>{if(!o.init){o.w=o.el.offsetWidth||80;o.h=o.el.offsetHeight||30;o.x=(parseFloat(o.el.style.left)||50)/100*W;o.y=H*(.2+.7*Math.random());o.el.style.left='0px';o.init=true}o.x+=o.vx;o.y+=o.vy;if(o.x<0){o.x=0;o.vx=Math.abs(o.vx)}if(o.x>W-o.w){o.x=W-o.w;o.vx=-Math.abs(o.vx)}if(o.y<-o.h)o.y=H+o.h});for(let a=0;a<nm.length;a++)for(let b=a+1;b<nm.length;b++){const A=nm[a],B=nm[b];const ax=A.x+A.w/2,ay=A.y+A.h/2,bx=B.x+B.w/2,by=B.y+B.h/2;const ox=(A.w+B.w)/2-Math.abs(ax-bx),oy=(A.h+B.h)/2-Math.abs(ay-by);if(ox>0&&oy>0){if(ox<oy){const s=ax<bx?1:-1;A.x-=s*ox/2;B.x+=s*ox/2;if((A.vx-B.vx)*s>0){const t=A.vx;A.vx=B.vx;B.vx=t}}else{const s=ay<by?1:-1;A.y-=s*oy/2;B.y+=s*oy/2;if((A.vy-B.vy)*s>0){const t=A.vy;A.vy=B.vy;B.vy=t}}}}nm.forEach(A=>{const R=A.w*.42,ccx=A.x+A.w/2,ccy=A.y+A.h/2;fl.forEach(g=>{const gx=g.x,gy=g.y-g.s*.5,r=g.s*.45;const dx=ccx-gx,dy=ccy-gy;const d=Math.hypot(dx,dy)||.01,min=R+r;if(d<min){const nx=dx/d,ny=dy/d,push=min-d;A.x+=nx*push;A.y+=ny*push;const rv=(A.vx-g.vx)*nx+(A.vy-g.vy)*ny;if(rv<0){A.vx-=rv*nx;A.vy-=rv*ny;g.vx+=rv*nx;g.vy+=rv*ny}}})});nm.forEach(o=>{o.el.style.transform='translate('+o.x+'px,'+o.y+'px)'})}const bgc=document.getElementById('bg'),bgx=bgc.getContext('2d');let fl=[];
function tick(){updNames();bgc.width=innerWidth;bgc.height=innerHeight;if(!fl.length)fl=Array.from({length:20},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:Math.random()*20+14,v:Math.random()*.5+.25,p:Math.random()*6,g:'♥★✦✿'[Math.floor(Math.random()*4)],c:['#FF6B9D','#fff','#FFD93D','#B79CFF'][Math.floor(Math.random()*4)]})).map(o=>({...o,vx:(Math.random()-.5)*.4,vy:-o.v}));
bgx.textAlign='center';for(let a=0;a<fl.length;a++)for(let b=a+1;b<fl.length;b++){const A=fl[a],B=fl[b];const dx=B.x-A.x,dy=B.y-A.y;const d=Math.hypot(dx,dy)||.01,min=(A.s+B.s)*.45;if(d<min){const nx=dx/d,ny=dy/d,push=(min-d)/2;A.x-=nx*push;A.y-=ny*push;B.x+=nx*push;B.y+=ny*push;const rv=(B.vx-A.vx)*nx+(B.vy-A.vy)*ny;if(rv<0){A.vx+=rv*nx;A.vy+=rv*ny;B.vx-=rv*nx;B.vy-=rv*ny}}}fl.forEach(o=>{o.x+=o.vx;o.y+=o.vy;o.vy+=(-o.v-o.vy)*.02;if(o.x<12){o.x=12;o.vx=Math.abs(o.vx)}if(o.x>innerWidth-12){o.x=innerWidth-12;o.vx=-Math.abs(o.vx)}if(o.y<-40){o.y=innerHeight+40;o.x=Math.random()*innerWidth;o.vx=(Math.random()-.5)*.4}bgx.globalAlpha=.55;bgx.fillStyle=o.c;bgx.font=o.s+'px serif';bgx.fillText(o.g,o.x+Math.sin(Date.now()/1000+o.p)*14,o.y)});
cv.width=innerWidth;cv.height=innerHeight;parts=parts.filter(p=>p.l>0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.vx*=.99;p.l--;p.r+=.2;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.min(1,p.l/40);cx.fillStyle=p.c;cx.fillRect(0,0,p.s,p.s*.55);cx.restore()});requestAnimationFrame(tick)}
